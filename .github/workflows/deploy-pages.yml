name: Publish site to main (GitHub Pages)

# GitHub Pages serves the root of `main` ("Deploy from a branch"). On every push to main this
# workflow builds the static export and commits it to the repository root, so the prototype at
# https://adhis-hertanto.github.io/xpansly/ updates without changing any Pages settings.
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the publish commit does not loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /xpansly
          NEXT_TELEMETRY_DISABLED: 1

      - name: Copy build output to the repository root
        run: |
          # Remove the previously published files (listed in .pages-manifest), then copy the new build.
          if [ -f .pages-manifest ]; then
            while IFS= read -r name; do
              [ -n "$name" ] && rm -rf -- "./$name"
            done < .pages-manifest
          fi
          (cd out && ls -A) > .pages-manifest
          cp -a out/. .
          # Serve files as-is (Jekyll would skip the _next folder).
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish"
            exit 0
          fi
          git commit -m "Publish site build for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push origin HEAD:main
